<header class="site-header">
  <div class="container header-inner">
    <a class="site-brand" href="{{ site.Home.RelPermalink }}" aria-label="Особистий університет — головна">
      <span class="brand-mark" aria-hidden="true">ОУ</span>
      <span>{{ site.Title }}</span>
    </a>
    <div class="header-actions">
      {{ partial "main-navigation.html" . }}
      <label class="theme-toggle">
        <input type="checkbox" data-theme-toggle aria-label="Перемкнути тему">
        <span class="theme-toggle__track" aria-hidden="true"></span>
      </label>
    </div>
  </div>
</header>
