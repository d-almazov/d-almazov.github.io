<header class="site-header" data-header>
  <div class="container header-inner">
    <a class="site-brand" href="{{ site.Home.RelPermalink }}" aria-label="{{ site.Title }} — головна">
      <span class="brand-mark" aria-hidden="true">ДА</span>
      <span>{{ site.Title }}</span>
    </a>
    <div class="header-actions">
      {{ partial "main-navigation.html" . }}
      <button class="theme-toggle" type="button" data-theme-toggle aria-label="Перемкнути тему">
        {{ partial "icon.html" (dict "name" "sun" "class" "icon-sun") }}
        {{ partial "icon.html" (dict "name" "moon" "class" "icon-moon") }}
      </button>
    </div>
  </div>
</header>
