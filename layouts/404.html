    <path pathLength="1" d="M10 60 H44"/><path pathLength="1" d="M38 55 l6 5 -6 5"/>
    <circle pathLength="1" cx="56" cy="60" r="12"/>
    <path pathLength="1" d="M68 60 H100"/><path pathLength="1" d="M94 55 l6 5 -6 5"/>
    <rect pathLength="1" x="100" y="38" width="56" height="44" rx="6"/>

    <text x="216" y="66" text-anchor="middle" class="illo-text">?</text>

  <p class="eyebrow">Помилка 404</p>
  <h1>Сторінку не знайдено</h1>

  <div class="button-group">
    <a class="button button--primary" href="{{ site.Home.RelPermalink }}">На головну {{ partial "icon.html" (dict "name" "arrow-right") }}</a>
    <a class="button button--secondary" href="{{ (site.GetPage "/courses").RelPermalink }}">До курсів</a>
  </div>
</section>
{{ end }}
