baseURL = "https://d-almazov.github.io/"
locale = "uk-UA"
defaultContentLanguage = "uk"
title = "Особистий сайт викладача"
enableRobotsTXT = true
disableKinds = ["taxonomy", "term"]

[params]
  description = "Денис Алмазов — викладач програмування (Python, MATLAB, Simulink), теорії автоматичного керування, промислової автоматизації та вбудованих систем. Курси, лекції та навчальні матеріали."
  author = "Денис Алмазов"
  authorFull = "Алмазов Денис Олегович"

[markup]
  [markup.highlight]
    noClasses = false
    lineNos = false
  [markup.goldmark]
    [markup.goldmark.renderer]
      unsafe = false
    [markup.goldmark.extensions.passthrough]
      enable = true
      [markup.goldmark.extensions.passthrough.delimiters]
        block = [['\[', '\]'], ['$$', '$$']]
        inline = [['\(', '\)'], ['$', '$']]

[menus]
  [[menus.main]]
    name = "Головна"
    pageRef = "/"
    weight = 10
  [[menus.main]]
    name = "Про мене"
    pageRef = "/about"
    weight = 20
  [[menus.main]]
    name = "Курси"
    pageRef = "/courses"
    weight = 30
  [[menus.main]]
    name = "Нотатки"
    pageRef = "/notes"
    weight = 40

[outputs]
  home = ["HTML", "RSS"]
  section = ["HTML", "RSS"]

[pagination]
  pagerSize = 10

[markup.tableOfContents]
  startLevel = 2
  endLevel = 3
  ordered = false
